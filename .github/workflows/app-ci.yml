name: App

# Analyze and test on every push and pull request; build the Android APK and an unsigned iOS
# build; on a v* tag, publish a GitHub release with the APK (the app's Android update check
# reads the latest release and its .apk asset).
#
# Repository settings used:
#   variable EVE_CLIENT_ID             client ID of the developers.eveonline.com application
#   secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#           ANDROID_KEY_PASSWORD       release signing key (required for tags)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib
      - run: flutter analyze
      - run: flutter test

  pipeline-tests:
    name: Pipeline unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: pipeline

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release tags need the ANDROID_KEYSTORE_* secrets."
              exit 1
            fi
            echo "No signing secrets: this APK is signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - name: Tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, pubspec $version"; exit 1; }
      - run: flutter build apk --release --dart-define=EVE_CLIENT_ID=${{ vars.EVE_CLIENT_ID }}
      - run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk "dist/PocketHangar-$version.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS build (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Signing and TestFlight need an Apple Developer account; this job only proves the app builds.
      - run: flutter build ios --release --no-codesign --dart-define=EVE_CLIENT_ID=${{ vars.EVE_CLIENT_ID }}
      - run: cd build/ios/iphoneos && zip -qry ../../../Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: Runner-unsigned.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pocket Hangar ${GITHUB_REF_NAME#v}" \
            --notes "Android APK. iOS builds go through TestFlight." \
            --latest
