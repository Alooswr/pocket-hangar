name: pocket_hangar
description: "Open-source EVE Online companion: fitting, skills, assets, market."
publish_to: 'none'

# Android versionCode comes from the number after "+". Bump both for every release.
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: ^3.4.3
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.9.0
  dio: ^5.11.1
  flutter_appauth: ^13.0.0
  flutter_secure_storage: ^11.2.0
  jose: ^0.3.5+2
  fl_chart: ^1.3.0
  path_provider: ^2.1.6
  path: ^1.9.1
  crypto: ^3.0.8
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true
